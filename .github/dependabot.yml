version: 2
updates:
  # NuGet: keep a classic K7.sln alongside K7.slnx so Dependabot can discover projects.
  # Package versions are centralized in Directory.Packages.props (CPM).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      nuget-microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "Aspire.*"
      nuget-other:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
          - "Aspire.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
