name: Helm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Chart lands at oci://ghcr.io/kaybi-gh/charts/k7
  OCI_REPO: oci://ghcr.io/kaybi-gh/charts

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve semver
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${VERSION#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4
        with:
          version: v3.16.4

      - name: Stamp chart version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/k7/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/k7/Chart.yaml

      - name: Log in to GHCR
        run: helm registry login "${REGISTRY}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push
        run: |
          helm package charts/k7 --destination dist
          helm push "dist/k7-${{ steps.version.outputs.version }}.tgz" "${OCI_REPO}"
