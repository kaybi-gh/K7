# Renovate dependency updates (NuGet including MAUI, Docker, GitHub Actions, devcontainers).
# Runs on the host runner (not the Mend cloud app) so maui-android workloads are available
# and android-arm / Fire Stick RIDs restore correctly.
#
# Uses the workflow GITHUB_TOKEN for git push and PR creation.
# CI on Renovate PRs is handled via pull_request_target in build/integration-tests workflows
# (pull_request does not run for PRs opened by github-actions[bot]).
# See docs/dev/developing.md#dependency-updates

name: Renovate

on:
  schedule:
    # Mondays 05:00 UTC (~07:00 Europe/Paris in winter)
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  workflows: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Renovate 44+ requires Node ^24.11 (uses RegExp.escape).
          node-version: '24'

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BINARY_SOURCE: global
          LOG_LEVEL: info
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ]; then
            export RENOVATE_SCHEDULE='["* 5-9 * * 1"]'
            export RENOVATE_TIMEZONE="Europe/Paris"
          else
            export RENOVATE_SCHEDULE='["at any time"]'
          fi
          npx --yes renovate@44.46.4 2>&1 | tee renovate.log
          if grep -qE "^(ERROR| WARN: Error updating branch)|Pull request creation error" renovate.log; then
            echo "::error::Renovate reported branch or PR creation errors"
            grep -E "^(ERROR| WARN: Error updating branch)|Pull request creation error" renovate.log || true
            exit 1
          fi
