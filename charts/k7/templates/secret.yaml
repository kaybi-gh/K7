{{- $manageHash := not .Values.security.existingSecret -}}
{{- $manageDbPw := and (not .Values.database.cnpg.enabled) (not .Values.database.external.existingSecret) -}}
{{- if or $manageHash $manageDbPw }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k7.fullname" . }}
  labels:
    {{- include "k7.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $manageHash }}
  apikeys-hash-secret: {{ required "security.apiKeysHashSecret is required (or set security.existingSecret)" .Values.security.apiKeysHashSecret | quote }}
  {{- end }}
  {{- if $manageDbPw }}
  database-password: {{ required "database.external.password is required (or set cnpg.enabled / database.external.existingSecret)" .Values.database.external.password | quote }}
  {{- end }}
{{- end }}
