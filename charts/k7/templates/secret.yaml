{{- $manageHash := not .Values.security.existingSecret -}}
{{- $db := .Values.database -}}
{{- $manageDbPw := or (and (eq $db.mode "deployment") (not $db.deployment.existingSecret)) (and (eq $db.mode "external") (not $db.external.existingSecret)) -}}
{{- $pwValue := ternary $db.deployment.password $db.external.password (eq $db.mode "deployment") -}}
{{- if or $manageHash $manageDbPw }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k7.fullname" . }}
  labels:
    {{- include "k7.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $manageHash }}
  apikeys-hash-secret: {{ required "security.apiKeysHashSecret is required (or set security.existingSecret)" .Values.security.apiKeysHashSecret | quote }}
  {{- end }}
  {{- if $manageDbPw }}
  database-password: {{ required "database password is required (or reference an existingSecret)" $pwValue | quote }}
  {{- end }}
{{- end }}
