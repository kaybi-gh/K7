# R8 rules for the Android release build (AndroidLinkTool=r8 in K7.Clients.MAUI.csproj).
# The .NET for Android SDK already keeps every Java type and member reachable from the
# managed bindings; the rules below cover what only K7 knows about.

# The keep rules the SDK generates from the bindings list methods only, never fields. A Java
# constant or enum value that managed code reads over JNI (GetStaticFieldID by name) is then
# removed as unused and the read throws NoSuchFieldError at run time. Seen with MAUI
# SecureStorage: EncryptedSharedPreferences$PrefKeyEncryptionScheme.AES256_SIV, which broke
# sign-in. Public and protected fields of every surviving class are kept; private fields
# are still renamed.
-keepclassmembers class ** {
    public protected <fields>;
}

# Media3 / ExoPlayer is driven through Java reflection by public method name
# (setSeekParameters, setErrorMessageProvider, setKeepContentOnPlayerReset, getWrappedPlayer,
# setTunnelingEnabled, ...) in BlazorPage.Android.cs and AndroidExoHlsTuning.cs. R8 cannot see
# those lookups and would drop the methods as unused, so the public and protected surface is
# kept. Private members stay free to be renamed and optimized: the only private access is a
# field scan by type (UnwrapPlayer), which does not depend on names. Keeping them too
# ({ *; }) drops the Play Console obfuscation score under its 25 % threshold.
-keep class androidx.media3.** { public protected *; }
-dontwarn androidx.media3.**
