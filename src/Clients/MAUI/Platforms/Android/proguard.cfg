# R8 rules for the Android release build (AndroidLinkTool=r8 in K7.Clients.MAUI.csproj).
# The .NET for Android SDK already keeps every Java type and member reachable from the
# managed bindings; the rules below cover what only K7 knows about.

# Media3 / ExoPlayer is driven through Java reflection by name (setSeekParameters,
# setErrorMessageProvider, setKeepContentOnPlayerReset, private player fields, ...) in
# BlazorPage.Android.cs and AndroidExoHlsTuning.cs. R8 cannot see those lookups, so the
# library is kept whole and unrenamed.
-keep class androidx.media3.** { *; }
-keep interface androidx.media3.** { *; }
-dontwarn androidx.media3.**
